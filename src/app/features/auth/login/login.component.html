<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/10 backdrop-blur mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">GoberVial</h1>
      <p class="text-blue-200 mt-2">Auditoria Ciudadana Vial</p>
      <p class="text-blue-300 text-sm mt-1">Departamento del Magdalena</p>
    </div>

    <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 shadow-2xl border border-white/20">
      <h2 class="text-xl font-semibold text-white mb-6">Iniciar Sesion</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-blue-200 mb-1">Correo Electronico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-blue-300/50 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition"
            [class.border-red-400]="email?.invalid && email?.touched"
          />
          <p *ngIf="email?.invalid && email?.touched" class="text-red-300 text-xs mt-1">
            <ng-container *ngIf="email?.errors?.['required']">El email es requerido.</ng-container>
            <ng-container *ngIf="email?.errors?.['email']">Formato de email invalido.</ng-container>
          </p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-blue-200 mb-1">Contrasena</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Tu contrasena"
            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-blue-300/50 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition"
            [class.border-red-400]="password?.invalid && password?.touched"
          />
          <p *ngIf="password?.invalid && password?.touched" class="text-red-300 text-xs mt-1">
            <ng-container *ngIf="password?.errors?.['required']">La contrasena es requerida.</ng-container>
            <ng-container *ngIf="password?.errors?.['minlength']">Minimo 8 caracteres.</ng-container>
          </p>
        </div>

        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full py-3 bg-blue-500 hover:bg-blue-400 disabled:bg-blue-500/50 text-white font-semibold rounded-xl transition duration-200 flex items-center justify-center"
        >
          <ng-container *ngIf="!isLoading">Ingresar</ng-container>
          <ng-container *ngIf="isLoading">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </ng-container>
        </button>
      </form>

      <p class="mt-6 text-center text-blue-200 text-sm">
        No tienes cuenta?
        <a routerLink="/register" class="text-white font-semibold hover:underline">Registrate aqui</a>
      </p>
    </div>

    <p class="text-center text-blue-300/50 text-xs mt-6">
      GoberVial v1.0 - Gobernacion del Magdalena
    </p>
  </div>
</div>
